<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ================= tokens ================= */
  :root{
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
    --accent:#0a84ff; --mb:28px; --dock:54px; --icon:76px;
  }
  [data-mode="dark"]{
    --win:rgba(30,30,34,.78); --win2:rgba(40,40,46,.62); --side:rgba(44,44,50,.5); --solid:#1f1f23;
    --text:#f5f5f7; --sub:rgba(235,235,245,.62); --faint:rgba(235,235,245,.35);
    --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.07); --field:rgba(255,255,255,.07);
    --bar:rgba(18,18,22,.35); --dockbg:rgba(40,40,48,.32); --menu:rgba(38,38,44,.82); --shadow:rgba(0,0,0,.5);
  }
  [data-mode="light"]{
    --win:rgba(248,248,250,.82); --win2:rgba(255,255,255,.6); --side:rgba(232,232,238,.62); --solid:#f4f4f7;
    --text:#1d1d1f; --sub:rgba(60,60,67,.66); --faint:rgba(60,60,67,.38);
    --line:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05); --field:rgba(0,0,0,.055);
    --bar:rgba(255,255,255,.4); --dockbg:rgba(255,255,255,.32); --menu:rgba(246,246,248,.86); --shadow:rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);font-size:13px;color:var(--text);background:#000;-webkit-font-smoothing:antialiased;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:default}
  input,textarea,select{font:inherit;color:inherit}
  [hidden]{display:none!important}
  ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 22%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  body.dragging iframe{pointer-events:none}
  body.dragging{cursor:grabbing}

  /* ================= wallpaper ================= */
  .wall{position:fixed;inset:0;background:#111 center/cover no-repeat;transition:opacity .6s}

  /* ================= boot ================= */
  #boot{position:fixed;inset:0;z-index:3000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;transition:opacity .5s}
  #boot svg{width:88px;height:88px;color:#fff}
  #boot .bar{width:180px;height:5px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:#fff;border-radius:5px;transition:width 1.5s cubic-bezier(.4,.1,.3,1)}
  #boot.go .bar i{width:100%}
  #boot.out{opacity:0;pointer-events:none}

  /* ================= login ================= */
  #login{position:fixed;inset:0;z-index:2500;color:#fff;display:flex;flex-direction:column;align-items:center;
         text-shadow:0 1px 12px rgba(0,0,0,.35);transition:opacity .45s,transform .45s}
  #login .lk-bg{position:absolute;inset:0;backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);background:rgba(0,0,0,.18)}
  #login.out{opacity:0;transform:scale(1.03);pointer-events:none}
  .lk-top{position:relative;text-align:center;margin-top:8vh}
  .lk-date{font-size:21px;font-weight:600;opacity:.92}
  .lk-time{font-size:clamp(84px,15vw,148px);font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:2px;
           font-family:"SF Pro Rounded",ui-rounded,var(--font)}
  .lk-user{position:relative;margin-top:auto;margin-bottom:9vh;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,90vw)}
  .avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:600;color:#fff;
          background:linear-gradient(160deg,#a1a1aa,#52525b);box-shadow:0 6px 24px rgba(0,0,0,.3);overflow:hidden;text-shadow:none;flex:none}
  .avatar svg{width:56%;height:56%;opacity:.95}
  .lk-name{font-size:17px;font-weight:600}
  .lk-field{display:flex;align-items:center;width:100%;height:36px;border-radius:18px;background:rgba(255,255,255,.22);
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:0 4px 0 16px;border:1px solid rgba(255,255,255,.18)}
  .lk-field input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:14px;text-shadow:none}
  .lk-field input::placeholder{color:rgba(255,255,255,.72)}
  .lk-field .go{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);flex:none;cursor:pointer}
  .lk-field .go:hover{background:rgba(255,255,255,.42)}
  .lk-field .go svg{width:14px;height:14px}
  .lk-field.enter{justify-content:space-between;cursor:pointer;padding-left:16px}
  .lk-field.enter span{font-size:13.5px;opacity:.85}
  .lk-field.bad{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .lk-hint{font-size:12px;opacity:.78;text-align:center;min-height:16px}
  .lk-walls{display:flex;gap:8px;margin-top:4px}
  .lk-walls button{width:46px;height:30px;border-radius:7px;background:center/cover;border:2px solid rgba(255,255,255,.25);cursor:pointer}
  .lk-walls button.on{border-color:#fff}
  .lk-switch{font-size:12px;color:#fff;opacity:.8;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .lk-switch:hover{opacity:1}

  /* ================= menubar ================= */
  #menubar{position:fixed;top:0;left:0;right:0;height:var(--mb);z-index:1001;display:flex;align-items:center;padding:0 10px;
           background:var(--bar);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
           font-size:13px;font-weight:500}
  #menubar .mi{height:22px;padding:0 9px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  #menubar .mi:hover,#menubar .mi.open{background:color-mix(in srgb,var(--text) 14%,transparent)}
  #menubar .mi.app{font-weight:700}
  #menubar .mi svg{width:15px;height:15px}
  #menubar .logo svg{width:17px;height:17px}
  #menubar .grow{flex:1}
  .bat{display:inline-flex;align-items:center;gap:5px}
  .bat .shell{width:24px;height:12px;border-radius:3.5px;border:1.2px solid currentColor;position:relative;padding:1.5px;opacity:.9}
  .bat .shell::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.6}
  .bat .shell i{display:block;height:100%;border-radius:1.5px;background:currentColor}
  .bat.low .shell i{background:#ff453a} .bat.chg .shell i{background:#30d158}

  /* dropdown menus + context menu */
  .menu{position:fixed;z-index:1100;min-width:220px;padding:5px;border-radius:9px;background:var(--menu);
        backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
        box-shadow:0 0 0 .5px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.12),0 12px 36px var(--shadow);font-size:13px}
  .menu button{display:flex;width:100%;align-items:center;gap:10px;height:24px;padding:0 10px;border-radius:5px;text-align:left;white-space:nowrap}
  .menu button:hover:not(:disabled){background:var(--accent);color:#fff}
  .menu button:disabled{opacity:.4}
  .menu button .k{margin-left:auto;opacity:.55;font-size:12px}
  .menu button:hover .k{opacity:.85}
  .menu hr{border:0;height:1px;background:var(--line);margin:5px 8px}

  /* ================= desktop widgets ================= */
  #widgets{position:fixed;top:calc(var(--mb) + 18px);left:18px;z-index:2;display:grid;grid-template-columns:repeat(2,158px);gap:14px}
  .wg{border-radius:22px;padding:15px 16px;background:var(--win2);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
      box-shadow:0 0 0 .5px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.15),0 8px 30px rgba(0,0,0,.18);height:158px;overflow:hidden}
  .wg.wide{grid-column:span 2}
  .wg .lbl{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
  .wg-hello h2{font-size:22px;font-weight:700;line-height:1.15;margin-top:6px}
  .wg-hello .t{font-size:44px;font-weight:700;letter-spacing:-.03em;margin-top:auto;font-family:"SF Pro Rounded",ui-rounded,var(--font)}
  .wg-hello{display:flex;flex-direction:column}
  .ring{width:76px;height:76px;margin:10px auto 6px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700}
  .wg-bat p{text-align:center;font-size:12px;color:var(--sub)}
  .wg-recent .row{display:flex;gap:12px;margin-top:14px}
  .wg-recent .row button{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;cursor:pointer}
  .wg-recent .row .ai{--sz:52px}
  .wg-recent .row span{font-size:11px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wg-recent .none{font-size:12.5px;color:var(--sub);margin-top:14px;line-height:1.5}
  .wg-note{background:#fef08a;color:#3f3a12;height:auto;min-height:120px;font-family:"Marker Felt","Comic Sans MS",var(--font)}
  .wg-note .lbl{color:#7a6c12}
  .wg-note p{font-size:14px;line-height:1.45;margin-top:8px;white-space:pre-wrap;word-break:break-word}

  /* ================= app icons ================= */
  .ai{--sz:var(--icon);width:var(--sz);height:var(--sz);border-radius:23%;position:relative;flex:none;display:grid;place-items:center;overflow:hidden;
      background:linear-gradient(155deg,var(--a),var(--b));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.2)}
  .ai::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 48%);pointer-events:none}
  .ai svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:#fff;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
  .ai span{font-size:calc(var(--sz) * .38);font-weight:800;color:#fff;letter-spacing:-.03em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

  /* ================= windows ================= */
  #windows{position:fixed;top:var(--mb);left:0;right:0;bottom:0;z-index:10}
  .window{position:absolute;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--win);
          backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
          box-shadow:0 0 0 .5px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.14),0 24px 70px var(--shadow);min-width:320px;min-height:220px}
  .window.inactive{box-shadow:0 0 0 .5px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.1),0 12px 34px var(--shadow)}
  .window.opening{animation:winin .26s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes winin{from{opacity:0;transform:scale(.92)}}
  .window.closing{animation:winout .18s ease-in forwards}
  @keyframes winout{to{opacity:0;transform:scale(.94)}}
  .window.minimizing{animation:winmin .3s cubic-bezier(.5,0,.75,0) forwards;transform-origin:50% 100%}
  @keyframes winmin{to{opacity:0;transform:translateY(40vh) scale(.15)}}
  .window.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
  .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
  .window.max .rz{display:none}

  .tb{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border-bottom:1px solid var(--line)}
  .tb.slim{height:40px}
  .tb h1{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb h1 small{font-weight:400;color:var(--sub);margin-left:6px;font-size:12px}
  .tb .grow{flex:1}
  .lights{display:flex;gap:8px;flex:none}
  .l{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
  .l svg{width:8px;height:8px;opacity:0;stroke:rgba(0,0,0,.6);stroke-width:2.2;fill:none;stroke-linecap:round}
  .lights:hover .l svg{opacity:1}
  .l.close{background:#ff5f57} .l.min{background:#febc2e} .l.zoom{background:#28c840}
  .window.inactive .l{background:color-mix(in srgb,var(--text) 22%,transparent)}
  .window.inactive .lights:hover .l.close{background:#ff5f57} .window.inactive .lights:hover .l.min{background:#febc2e} .window.inactive .lights:hover .l.zoom{background:#28c840}
  .tbtn{height:28px;min-width:30px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--sub)}
  .tbtn:hover{background:var(--hover);color:var(--text)}
  .tbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tbtn.on{color:#ffd60a}
  .tbtn.on svg{fill:#ffd60a;stroke:#ffd60a}
  .search{display:flex;align-items:center;gap:6px;height:28px;width:220px;border-radius:7px;background:var(--field);padding:0 9px;color:var(--sub)}
  .search svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px;color:var(--text)}
  .search input::placeholder{color:var(--faint)}
  .search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
  select.sel{height:26px;border-radius:6px;border:0;background:var(--field);color:var(--text);padding:0 8px;font-size:12.5px;outline:none}

  /* split layout (sidebar + main) */
  .split{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
  .side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
  .side .sh{height:52px;flex:none;display:flex;align-items:center;padding:0 16px}
  .side h6{font-size:11px;font-weight:700;color:var(--faint);padding:10px 18px 4px}
  .side .it{display:flex;align-items:center;gap:8px;height:28px;margin:0 10px;padding:0 9px;border-radius:6px;font-size:13px;text-align:left}
  .side .it:hover{background:var(--hover)}
  .side .it.on{background:color-mix(in srgb,var(--text) 12%,transparent)}
  .side .it svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side .it .n{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .scroll{flex:1;overflow:auto;min-height:0}
  .status{height:26px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--sub)}

  /* games launcher */
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--icon) + 34px),1fr));gap:20px 6px;padding:22px 18px 30px}
  .gi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:10px;position:relative;cursor:pointer}
  .gi:hover{background:var(--hover)}
  .gi:active .ai{transform:scale(.94)}
  .gi .ai{transition:transform .12s}
  .gi .nm{font-size:12px;text-align:center;line-height:1.3;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .gi .fv{position:absolute;top:4px;right:calc(50% - var(--icon)/2 - 12px);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
          background:var(--menu);box-shadow:0 1px 4px rgba(0,0,0,.3);opacity:0;transition:.12s;z-index:2;cursor:pointer}
  .gi:hover .fv,.gi .fv.on{opacity:1}
  .gi .fv svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:2}
  .gi .fv.on svg{fill:#ffd60a;stroke:#ffd60a}
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--sub);line-height:1.6}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}
  .skel{height:calc(var(--icon) + 46px);border-radius:12px;background:var(--hover)}

  /* player */
  .stage{position:relative;flex:1;background:#000;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .launching{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--solid);color:var(--sub);transition:opacity .3s;font-size:13px}
  .launching .ai{--sz:96px;animation:bounce 1s ease-in-out infinite}
  @keyframes bounce{50%{transform:translateY(-10px)}}
  .launching .pb{width:160px;height:4px;border-radius:4px;background:var(--hover);overflow:hidden}
  .launching .pb i{display:block;height:100%;width:30%;background:var(--accent);border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
  .launching .er{color:#ff453a;text-align:center;max-width:80%}

  /* links */
  .lrows{padding:8px 10px}
  .lr{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px}
  .lr:hover{background:var(--hover)}
  .lr .t{flex:1;min-width:0}
  .lr .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lr .t small{display:block;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .dot.green{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.18)}
  .dot.yellow{background:#ffd60a;box-shadow:0 0 0 3px rgba(255,214,10,.18)}
  .dot.red{background:#ff453a;box-shadow:0 0 0 3px rgba(255,69,58,.18)}
  .pill{height:26px;padding:0 12px;border-radius:13px;background:var(--field);font-size:12px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;color:var(--text);text-decoration:none}
  .pill:hover{background:color-mix(in srgb,var(--text) 14%,transparent)}
  .pill.blue{background:var(--accent);color:#fff}
  .legend{display:flex;gap:16px;align-items:center;justify-content:center}
  .legend span{display:inline-flex;gap:6px;align-items:center}
  .legend .dot{width:8px;height:8px;box-shadow:none}

  /* settings + admin forms */
  .pane{padding:22px 26px 30px;max-width:720px}
  .pane h2{font-size:20px;font-weight:700;margin-bottom:16px}
  .group{background:var(--win2);border-radius:10px;box-shadow:inset 0 0 0 .5px var(--line);margin-bottom:18px;overflow:hidden}
  .group > .row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;border-top:1px solid var(--line)}
  .group > .row:first-child{border-top:0}
  .group .row .lab{flex:1}
  .group .row .lab small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
  .gtitle{font-size:12px;font-weight:600;color:var(--sub);margin:0 4px 7px}
  .tog{width:38px;height:22px;border-radius:11px;background:color-mix(in srgb,var(--text) 22%,transparent);position:relative;cursor:pointer;flex:none;transition:.2s}
  .tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
  .tog.on{background:#30d158}
  .tog.on::after{left:18px}
  input[type=range]{accent-color:var(--accent);width:180px}
  .modes{display:flex;gap:16px}
  .mode{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:12px}
  .mode .pv{width:96px;height:62px;border-radius:8px;border:3px solid transparent;overflow:hidden;display:grid;grid-template-rows:12px 1fr}
  .mode.on .pv{border-color:var(--accent)}
  .mode .pv i{display:block}
  .accents{display:flex;gap:10px;flex-wrap:wrap}
  .accents button{width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
  .accents button.on{outline:2.5px solid var(--text);outline-offset:2px}
  .wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .wp{cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:12px;text-align:center;position:relative}
  .wp .th{aspect-ratio:16/10;border-radius:9px;background:center/cover;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.18);border:3px solid transparent}
  .wp.on .th{border-color:var(--accent)}
  .wp .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff453a;color:#fff;display:none;place-items:center;font-size:14px;line-height:1;cursor:pointer}
  .wp:hover .del{display:grid}
  .wp.add .th{display:grid;place-items:center;background:var(--field);font-size:28px;color:var(--sub);font-weight:300}
  .bigwp{aspect-ratio:16/9;border-radius:12px;background:center/cover;box-shadow:0 4px 20px rgba(0,0,0,.25);margin-bottom:18px;max-width:420px}
  .avs{display:flex;gap:8px;flex-wrap:wrap}
  .avs button{width:40px;height:40px;border-radius:50%;font-size:20px;display:grid;place-items:center;background:var(--field);cursor:pointer}
  .avs button.on{outline:2.5px solid var(--accent);outline-offset:1px}
  .fld{height:30px;border-radius:7px;border:0;background:var(--field);padding:0 10px;outline:none;font-size:13px;color:var(--text);min-width:0;box-shadow:inset 0 0 0 .5px var(--line)}
  .fld:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
  textarea.fld{height:auto;padding:8px 10px;resize:vertical;line-height:1.5;width:100%}
  .btn{height:28px;padding:0 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.45;filter:none;cursor:default}
  .btn.gray{background:var(--field);color:var(--text);box-shadow:inset 0 0 0 .5px var(--line)}
  .btn.red{background:none;color:#ff453a;box-shadow:inset 0 0 0 1px color-mix(in srgb,#ff453a 50%,transparent)}
  .help{color:var(--sub);font-size:12px;line-height:1.6;margin:8px 4px 0}
  .help a{color:var(--accent)}
  .msg{min-height:18px;font-size:12px;margin:6px 4px 0;color:var(--sub);white-space:pre-wrap}
  .msg.e{color:#ff453a} .msg.ok{color:#30d158}
  .about{text-align:center;padding:26px 24px}
  .about .logo{width:84px;height:84px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000))}
  .about .logo svg{width:52px;height:52px}
  .about h2{font-size:24px;font-weight:700}
  .about .ver{color:var(--sub);font-size:12px;margin:2px 0 16px}
  .about dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;text-align:left;font-size:12.5px;max-width:280px;margin:0 auto}
  .about dt{color:var(--sub);text-align:right;font-weight:600}

  /* admin */
  .lockbox{max-width:300px;margin:9vh auto 0;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .lockbox .lic{width:64px;height:64px;margin:0 auto 4px;border-radius:50%;background:var(--field);display:grid;place-items:center}
  .lockbox .lic svg{width:30px;height:30px;stroke:var(--sub);fill:none;stroke-width:1.8}
  .lockbox h3{font-size:15px;font-weight:700}
  .lockbox .fld{height:34px;text-align:center}
  .lockbox.bad .fld{animation:shake .35s;box-shadow:0 0 0 2px #ff453a}
  .lockbox.wide{max-width:420px;text-align:left}
  .lrow{display:grid;grid-template-columns:16px 16px minmax(0,1fr) minmax(0,1.6fr) 24px;gap:8px;align-items:center;padding:5px 14px;border-top:1px solid var(--line)}
  .lrow:first-child{border-top:0}
  .lrow input[type=checkbox]{accent-color:var(--accent)}
  button.dot{width:13px;height:13px;cursor:pointer}
  .lin{background:none;border:1px solid transparent;border-radius:5px;font-size:12.5px;padding:3px 6px;outline:none;min-width:0;width:100%;color:var(--text)}
  .lin:hover{border-color:var(--line)} .lin:focus{border-color:var(--accent);background:var(--field)}
  .lin.u{color:var(--sub)}
  .pk{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--field);cursor:pointer}
  .pk.on{box-shadow:inset 0 0 0 2px var(--accent)}
  .pk .dot{box-shadow:none}
  .xbtn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--sub);cursor:pointer;font-size:15px}
  .xbtn:hover{background:#ff453a;color:#fff}
  .irow{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
  .irow:first-child{border-top:0}
  .irow .ai{--sz:34px}
  .irow b{font-weight:600;width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .irow .fld{flex:1}

  /* ================= dock ================= */
  #dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:1000;display:flex;align-items:flex-end;gap:4px;
        padding:5px 6px;border-radius:20px;background:var(--dockbg);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
        box-shadow:0 0 0 .5px rgba(0,0,0,.25),inset 0 0 0 .5px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,.8,.3,1);max-width:calc(100vw - 16px)}
  body.dock-auto #dock{transform:translate(-50%,calc(100% + 14px))}
  body.dock-auto.dock-peek #dock{transform:translateX(-50%)}
  #dockHot{position:fixed;left:0;right:0;bottom:0;height:6px;z-index:999}
  .di{--s:1;position:relative;width:calc(var(--dock) * var(--s));height:calc(var(--dock) * var(--s));transition:width .12s ease-out,height .12s ease-out;cursor:pointer;flex:none}
  .di .ai{--sz:100%;width:100%;height:100%}
  .di .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:6px;background:var(--menu);
           backdrop-filter:blur(20px);font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;box-shadow:0 2px 10px var(--shadow)}
  .di:hover .tip{opacity:1}
  .di.run::after{content:"";position:absolute;bottom:-4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text);opacity:.75}
  .di.bounce .ai{animation:dbounce .5s ease-in-out 2}
  @keyframes dbounce{50%{transform:translateY(-14px)}}
  .dsep{width:1px;align-self:stretch;margin:4px 3px;background:color-mix(in srgb,var(--text) 22%,transparent)}
  .launch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9%;width:58%;height:58%}
  .launch-grid i{border-radius:28%;display:block}

  /* ================= spotlight ================= */
  #spot{position:fixed;inset:0;z-index:1200}
  #spot .box{position:absolute;top:22vh;left:50%;transform:translateX(-50%);width:min(660px,calc(100vw - 24px));border-radius:14px;overflow:hidden;
             background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
             box-shadow:0 0 0 .5px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.14),0 24px 70px var(--shadow);animation:winin .18s ease-out}
  #spot .in{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px}
  #spot .in svg{width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:2;flex:none}
  #spot input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:22px;font-weight:400;color:var(--text)}
  #spot input::placeholder{color:var(--faint)}
  #spot .res{border-top:1px solid var(--line);max-height:50vh;overflow:auto;padding:6px}
  #spot .res:empty{display:none}
  #spot h6{font-size:11px;font-weight:700;color:var(--faint);padding:8px 12px 4px}
  #spot .r{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;cursor:pointer}
  #spot .r.on{background:var(--accent);color:#fff}
  #spot .r .ai{--sz:30px}
  #spot .r .gl{width:30px;height:30px;border-radius:7px;background:var(--field);display:grid;place-items:center;flex:none}
  #spot .r .gl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #spot .r b{font-weight:500;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #spot .r small{font-size:12px;opacity:.6}

  /* ================= notifications ================= */
  #notifs{position:fixed;top:calc(var(--mb) + 10px);right:12px;z-index:1300;display:flex;flex-direction:column;gap:10px;width:min(350px,calc(100vw - 24px))}
  .nt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--menu);
      backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
      box-shadow:0 0 0 .5px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.14),0 10px 30px var(--shadow);
      animation:ntin .4s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
  .nt.out{animation:ntout .25s ease-in forwards}
  @keyframes ntin{from{transform:translateX(calc(100% + 20px))}}
  @keyframes ntout{to{transform:translateX(calc(100% + 20px));opacity:0}}
  .nt .ai{--sz:36px}
  .nt b{display:block;font-size:13px;font-weight:700}
  .nt span{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;word-break:break-word}
  .nt .when{margin-left:auto;font-size:11px;color:var(--faint);flex:none}

  /* ================= small screens ================= */
  @media (max-width:760px){
    :root{--dock:44px;--icon:62px}
    #widgets{display:none}
    .window{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--dock) - 18px)!important;border-radius:0;min-width:0}
    .window .l.zoom,.rz{display:none}
    .split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center;padding:0 6px}
    .side .sh{height:44px;padding:0 8px}
    .side h6{display:none}
    .side .it{margin:0 2px;flex:none}
    .side .it .n{display:none}
    .search{width:auto;flex:1}
    .tb{gap:6px;padding:0 10px}
    .tb h1 small{display:none}
    .pane{padding:16px}
    #menubar .mi.hide-sm,#menubar .hide-sm{display:none}
    .lrow{grid-template-columns:16px 16px minmax(0,1fr) 24px}
    .lrow .u{grid-column:3/4;grid-row:2}
    .irow b{width:90px}
  }
</style>
</head>

<script>
/* =====================================================================
   CONFIG — the only part you need to edit.
   ===================================================================== */
const CONFIG = {
  siteName: "arcade",
  user:     "bubbls",          // GitHub user that owns the games repo
  repo:     "ugs-singlefile",  // games repo
  branch:   "main",
  gamesDir: "UGS-Files",       // folder in the games repo that holds the games
  stripPrefix: "cl",           // filename prefix to drop from titles ("clslope.html" -> "Slope")
  // Game list, served by jsDelivr so the site never contacts GitHub (works where github.com is blocked).
  // Rebuild it with make-list.py when new games are added.
  list: "https://cdn.jsdelivr.net/gh/rayruels/ggs@main/games.json",
  githubFallback: true,        // if games.json is missing, ask api.github.com instead
  // Your site repo. site.json in it holds links, announcement, site name, game logos and the admin passcode check.
  site: { user: "rayruels", repo: "ggs", branch: "main", file: "site.json" },
};
/* ===================================================================== */

const BASE = `https://cdn.jsdelivr.net/gh/${CONFIG.user}/${CONFIG.repo}@${CONFIG.branch}/`;
const DEFAULT_NAME = CONFIG.siteName;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem("arcade:"+k)) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem("arcade:"+k, JSON.stringify(v)); return true }catch{ return false } },
  del(k){ try{ localStorage.removeItem("arcade:"+k) }catch{} },
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => [...String(s)].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ico = (name, extra = "") => `<svg ${extra}><use href="#g-${name}"/></svg>`;

let games = [];
let favs = new Set(store.get("favs", []));
let recent = store.get("recent", []);
let plays = store.get("plays", {});
let user = store.get("user", null);          // { name, created, avatar }
let prefs = Object.assign({ mode:"auto", accent:"auto", wall:"sakura", dockSize:54, mag:true, autohide:false, widgets:true, iconSize:76 }, store.get("prefs", {}));
let customWalls = store.get("walls", []);    // [{ id, name, src }]
let battery = null;
let current = null;                           // game playing in the player window
let siteData = { siteName:"", announcement:"", links:[], icons:{}, admin:null };
const savePrefs = () => store.set("prefs", prefs);

/* =====================================================================
   WALLPAPERS — original anime-style scenes drawn as SVG
   ===================================================================== */
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const F = n => Math.round(n * 10) / 10;
const lg = (id, stops, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o,c,a=1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join("")}</linearGradient>`;
const rg = (id, stops) => `<radialGradient id="${id}">${stops.map(([o,c,a=1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join("")}</radialGradient>`;
const svgDoc = (defs, body) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${body}</svg>`;
const bez = (p, t) => { const u = 1 - t; return [0,1].map(i => u*u*u*p[0][i] + 3*u*u*t*p[1][i] + 3*u*t*t*p[2][i] + t*t*t*p[3][i]); };

function wpSakura(){
  const r = rng(11); let b = "";
  const defs = lg("sky", [[0,"#86c5ff"],[.45,"#c9e1ff"],[.75,"#ffd5e3"],[1,"#ffe7dd"]]) + rg("sun", [[0,"#fffdf3"],[.3,"#fff2dc",.85],[1,"#ffeedd",0]])
    + lg("gr", [[0,"#ffc3d6"],[1,"#ee8fb0"]]) + lg("haze", [[0,"#fff",0],[1,"#fff",.6]]);
  b += `<rect width="1920" height="1080" fill="url(#sky)"/><circle cx="1430" cy="290" r="340" fill="url(#sun)"/><circle cx="1430" cy="290" r="68" fill="#fffaf0"/>`;
  for(let i = 0; i < 6; i++){ const x = 200 + r()*1500, y = 120 + r()*260; b += `<ellipse cx="${F(x)}" cy="${F(y)}" rx="${F(90+r()*120)}" ry="${F(16+r()*10)}" fill="#fff" opacity="${F(.45+r()*.3)}"/>`; }
  b += `<path d="M540 810 L925 470 Q960 442 995 470 L1380 810Z" fill="#9db3e2"/>`;
  b += `<path d="M862 526 L925 470 Q960 442 995 470 L1058 526 L1028 518 L1008 542 L985 514 L960 548 L936 514 L914 540 L893 518Z" fill="#f6f9ff"/>`;
  b += `<rect y="600" width="1920" height="240" fill="url(#haze)"/>`;
  for(let layer = 0; layer < 2; layer++){
    const base = 770 + layer*75, cols = layer ? ["#f29bbb","#f5abc6","#f8bdd2"] : ["#f8c7d8","#fbd4e1","#f6bccf"];
    const yAt = x => base - 30*Math.sin(x/260 + layer*2) - 18*Math.sin(x/97);
    let d = `M0 ${F(yAt(0))}`; for(let x = 0; x <= 1920; x += 40) d += ` L${x} ${F(yAt(x))}`;
    b += `<path d="${d} L1920 1080 L0 1080Z" fill="${layer ? "#f0a0bd" : "#f7c2d4"}"/>`;
    for(let i = 0; i < 150; i++){ const x = r()*1940 - 10; b += `<circle cx="${F(x)}" cy="${F(yAt(x) + r()*18 - 4)}" r="${F(12+r()*26)}" fill="${cols[i%3]}" opacity="${F(.75+r()*.25)}"/>`; }
  }
  b += `<path d="M0 965 Q480 905 960 952 T1920 935 V1080 H0Z" fill="url(#gr)"/>`;
  const branch = (P, w, n) => {
    b += `<path d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}" fill="none" stroke="#4a2a33" stroke-width="${w}" stroke-linecap="round"/>`;
    for(let i = 0; i < n; i++){
      const t = .2 + r()*.8, [x, y] = bez(P, t), a = r()*Math.PI*2, d = r()*w*2.6;
      const cx = x + Math.cos(a)*d, cy = y + Math.sin(a)*d, rr = 7 + r()*11;
      b += `<circle cx="${F(cx)}" cy="${F(cy)}" r="${F(rr)}" fill="${["#ffb6cf","#ff9fc1","#ffd0e1","#fff1f6"][i%4]}"/>`;
      if(i % 3 === 0) b += `<circle cx="${F(cx)}" cy="${F(cy)}" r="${F(rr*.25)}" fill="#f2668f"/>`;
    }
  };
  branch([[-40,60],[260,30],[520,210],[790,160]], 26, 170);
  branch([[300,90],[360,200],[330,300],[430,380]], 12, 70);
  branch([[560,170],[640,240],[700,330],[650,420]], 9, 50);
  branch([[1970,30],[1760,40],[1650,150],[1470,170]], 22, 140);
  branch([[1700,90],[1690,190],[1760,260],[1720,340]], 10, 55);
  for(let i = 0; i < 110; i++){ b += `<ellipse cx="${F(r()*1920)}" cy="${F(r()*1080)}" rx="${F(5+r()*5)}" ry="${F(3+r()*2)}" transform="rotate(${F(r()*180)})" fill="#ffadc8" opacity="${F(.6+r()*.4)}"/>`; }
  return svgDoc(defs, b);
}
function wpNeon(){
  const r = rng(23); let b = "";
  const defs = lg("sky", [[0,"#060217"],[.45,"#170a37"],[.7,"#45145a"],[.84,"#a72c6e"],[1,"#ff6a7a"]])
    + rg("moon", [[0,"#ffe9f6",.9],[.4,"#ff9ad5",.25],[1,"#ff9ad5",0]]) + lg("gnd", [[0,"#0b0518"],[1,"#05020c"]])
    + `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
    + `<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>`;
  b += `<rect width="1920" height="1080" fill="url(#sky)"/>`;
  for(let i = 0; i < 260; i++) b += `<circle cx="${F(r()*1920)}" cy="${F(r()*620)}" r="${F(.6+r()*1.6)}" fill="#fff" opacity="${F(.3+r()*.7)}"/>`;
  b += `<circle cx="1470" cy="240" r="260" fill="url(#moon)"/><circle cx="1470" cy="240" r="84" fill="#fff0f8"/><circle cx="1445" cy="220" r="14" fill="#f7d9ea"/><circle cx="1500" cy="270" r="9" fill="#f7d9ea"/>`;
  let x = -20; while(x < 1940){ const w = 50 + r()*90, h = 200 + r()*260; b += `<rect x="${F(x)}" y="${F(870-h)}" width="${F(w)}" height="${F(h+10)}" fill="#2a1147"/>`; if(r() < .25) b += `<rect x="${F(x+w/2-1.5)}" y="${F(870-h-50)}" width="3" height="50" fill="#2a1147"/><circle cx="${F(x+w/2)}" cy="${F(870-h-52)}" r="3" fill="#ff4d6d" filter="url(#glow)"/>`; x += w + r()*10; }
  const neon = ["#ff4fd8","#3ef4ff","#ffd23f","#7cff6b"];
  x = -30; while(x < 1950){
    const w = 80 + r()*120, h = 240 + r()*360, top = 900 - h;
    b += `<rect x="${F(x)}" y="${F(top)}" width="${F(w)}" height="${F(h+20)}" fill="#120820"/>`;
    for(let wy = top + 18; wy < 880; wy += 22) for(let wx = x + 10; wx < x + w - 12; wx += 15) if(r() < .26) b += `<rect x="${F(wx)}" y="${F(wy)}" width="7" height="11" fill="${["#ffd36e","#7ef9ff","#ff9ee8"][Math.floor(r()*3)]}" opacity="${F(.55+r()*.45)}"/>`;
    if(r() < .35){ const c = neon[Math.floor(r()*4)], sx = x + w*.3, sh = 60 + r()*90, sy = top + 30 + r()*80;
      b += `<rect x="${F(sx)}" y="${F(sy)}" width="22" height="${F(sh)}" rx="4" fill="none" stroke="${c}" stroke-width="4" filter="url(#glow)"/>`;
      b += `<rect x="${F(sx-4)}" y="935" width="30" height="${F(sh*.9)}" fill="${c}" opacity=".35" filter="url(#blur)"/>`; }
    x += w + 6 + r()*14;
  }
  b += `<rect y="900" width="1920" height="180" fill="url(#gnd)" opacity=".92"/>`;
  for(let i = 0; i < 40; i++) b += `<rect x="${F(r()*1920)}" y="${F(925+r()*140)}" width="${F(30+r()*120)}" height="2" fill="${neon[i%4]}" opacity="${F(.15+r()*.25)}"/>`;
  return svgDoc(defs, b);
}
function wpSunset(){
  const r = rng(5); let b = "";
  const defs = lg("sky", [[0,"#1c0a44"],[.3,"#57196c"],[.5,"#b1386c"],[.62,"#ee6a5a"],[.7,"#ffa45c"]]) + lg("sun", [[0,"#fff6b0"],[.6,"#ffb15e"],[1,"#ff6f61"]])
    + lg("sea", [[0,"#7b2d6b"],[.25,"#3b1752"],[1,"#100624"]])
    + `<mask id="cut"><rect width="1920" height="1080" fill="#fff"/>${Array.from({length:9}, (_, i) => `<rect y="${640 + i*14 + i*i*1.6}" width="1920" height="${3 + i*1.4}" fill="#000"/>`).join("")}</mask>`;
  b += `<rect width="1920" height="1080" fill="url(#sky)"/>`;
  for(let i = 0; i < 90; i++) b += `<circle cx="${F(r()*1920)}" cy="${F(r()*330)}" r="${F(.6+r()*1.3)}" fill="#fff" opacity="${F(.3+r()*.6)}"/>`;
  b += `<circle cx="960" cy="640" r="270" fill="url(#sun)" mask="url(#cut)"/>`;
  for(let i = 0; i < 14; i++){ const y = 200 + r()*480, c = ["#ff8fb1","#c7579a","#ffb38a","#8d3a8f"][i%4]; b += `<ellipse cx="${F(r()*1920)}" cy="${F(y)}" rx="${F(180+r()*380)}" ry="${F(10+r()*22)}" fill="${c}" opacity="${F(.45+r()*.4)}"/>`; }
  b += `<rect y="770" width="1920" height="310" fill="url(#sea)"/><rect y="768" width="1920" height="4" fill="#ffd28a" opacity=".7"/>`;
  for(let i = 0; i < 46; i++){ const y = 776 + i*6.5 + i*i*.05, w = 520 - i*9 + r()*60; b += `<rect x="${F(960 - w/2 + (r()-.5)*40)}" y="${F(y)}" width="${F(w)}" height="${F(2+r()*3)}" rx="2" fill="${i % 3 ? "#ffcf7a" : "#ff8f6b"}" opacity="${F(.75 - i*.014)}"/>`; }
  for(let i = 0; i < 5; i++){ const x = 1250 + r()*400, y = 360 + r()*140, s = .6 + r()*.6; b += `<path d="M${F(x)} ${F(y)} q${F(9*s)} ${F(-8*s)} ${F(18*s)} 0 q${F(9*s)} ${F(-8*s)} ${F(18*s)} 0" fill="none" stroke="#2a0d3a" stroke-width="3" stroke-linecap="round"/>`; }
  return svgDoc(defs, b);
}
function wpSummer(){
  const r = rng(9); let b = "";

const prettify = s => {
  s = s.replace(/\.html?$/i, "").replace(/\s*\(\d+\)$/, "");
  if(CONFIG.stripPrefix && s.toLowerCase().startsWith(CONFIG.stripPrefix) && s.length > CONFIG.stripPrefix.length) s = s.slice(CONFIG.stripPrefix.length);
  return s.replace(/[-_.]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([a-zA-Z])(\d)/g, "$1 $2").replace(/(\d)([a-zA-Z]{3,})/g, "$1 $2")
          .replace(/\s+/g, " ").trim().replace(/(^|\s)(\w)/g, (m, a, c) => a + c.toUpperCase());
};
function normalize(g){
  if(typeof g === "string") g = { path: g };
  const id = g.id || g.path.replace(/\/index\.html?$/i, "").split("/").pop().replace(/\.html?$/i, "");
  return { id, title: g.title || prettify(id), path: g.path, thumb: g.thumb || null, tags: g.tags || [] };
}
async function loadGames(){
  if(CONFIG.list){
    try{
      const r = await fetch(CONFIG.list, {cache:"no-cache"});
      if(r.ok){ const list = await r.json(); if(Array.isArray(list) && list.length) return list.map(normalize); }
    }catch{}
  }
  if(!CONFIG.githubFallback) throw new Error("couldn't load games.json");
  const key = `tree:${CONFIG.user}/${CONFIG.repo}@${CONFIG.branch}`;
  const cached = store.get(key, null);
  if(cached && Date.now() - cached.t < 6*3600e3) return discover(cached.files);
  try{
    const r = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
    if(!r.ok) throw new Error(r.status === 403 ? "GitHub rate limit hit, try again in a bit" : `GitHub said ${r.status}`);
    const files = (await r.json()).tree.filter(x => x.type === "blob").map(x => x.path);
    store.set(key, {t: Date.now(), files});
    return discover(files);
  }catch(e){ if(cached) return discover(cached.files); throw e; }
}
function discover(files){
  const dir = CONFIG.gamesDir.replace(/\/$/, "") + "/";
  return files.filter(f => f.startsWith(dir) && !f.slice(dir.length).includes("/") && /\.html?$/i.test(f)).map(normalize);
}

document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".window");
  if(w) focusWin(w);
  if(!e.target.closest(".menu,[data-menu]")) closeMenu();
  if(e.target.closest(".l")) return;
  const rz = e.target.closest(".rz");
  if(rz && w){
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight;
    document.body.classList.add("dragging");
    const mv = ev => { w.style.width = Math.max(320, ow + ev.clientX - sx) + "px"; w.style.height = Math.max(220, oh + ev.clientY - sy) + "px"; };
    const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); document.body.classList.remove("dragging"); };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
    return;
  }
  const h = e.target.closest("[data-drag]");
  if(!h || !w || e.target.closest("button,input,select,textarea,a,label") || w.classList.contains("max") || innerWidth <= 760) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop;
  document.body.classList.add("dragging");
  const mv = ev => { w.style.left = (ox + ev.clientX - sx) + "px"; w.style.top = Math.max(0, Math.min(innerHeight - 80, oy + ev.clientY - sy)) + "px"; };

  addEventListener("pointermove", mv); addEventListener("pointerup", up);
});

const GL = { view:"all", q:"", sort: store.get("sort", "name"), shown:120 };

function showGames(view){ GL.view = view; GL.shown = 120; openWin("games"); renderGames(); $("#glScroll").scrollTop = 0; }
function visibleGames(){

  if(GL.q){ const q = GL.q.toLowerCase().replace(/\s+/g, ""); list = list.filter(g => g.title.toLowerCase().replace(/\s+/g, "").includes(q) || g.id.toLowerCase().includes(q)); }

    if(GL.sort === "name") list.sort((a, b) => a.title.localeCompare(b.title));
    else if(GL.sort === "played") list.sort((a, b) => (plays[b.id]||0) - (plays[a.id]||0) || a.title.localeCompare(b.title));
    else if(GL.sort === "recent"){ const idx = id => { const i = recent.indexOf(id); return i < 0 ? 1e9 : i; }; list.sort((a, b) => idx(a.id) - idx(b.id) || a.title.localeCompare(b.title)); }
  }

}

    grid.innerHTML = `<div class="empty">${GL.q ? `<b>No results for "${esc(GL.q)}"</b>Try a different name.`
      : GL.view === "fav" ? `<b>No favorites yet</b>Hover a game and click the star, or right-click it.` : `<b>Nothing played yet</b>Games you open show up here.`}</div>`;

}

   ===================================================================== */
// jsDelivr serves .html as plain text, so fetch the game's HTML and inject it into an iframe
// with a <base> tag pointing at its folder, so its scripts/images load from the CDN.
async function gameHTML(g){
  const url = BASE + g.path;
  const r = await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  let html = await r.text();
  const base = `<base href="${url.replace(/[^/]*$/, "")}">`;
  if(/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, m => m + base);
  else if(/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, m => m + "<head>" + base + "</head>");
  else html = base + html;
  return html;
}
async function play(g){
  if(!g) return;
  current = g;
  const w = openWin("player");
  w.dataset.title = g.title;
  $("#mbApp").textContent = g.title;
  $("#pTitle").textContent = g.title;
  $("#pFav").classList.toggle("on", favs.has(g.id));
  recent = [g.id, ...recent.filter(x => x !== g.id)].slice(0, 40);
  plays[g.id] = (plays[g.id] || 0) + 1;
  store.set("recent", recent); store.set("plays", plays);
  renderDock(); renderWidgets(); if(isOpen("games")) renderGames();
  const stage = $("#stage");
  stage.querySelector("iframe")?.remove();
  const L = $("#launching");
  L.hidden = false; L.style.opacity = 1;
  L.innerHTML = `${iconHTML(g)}<div>Opening ${esc(g.title)}…</div><div class="pb"><i></i></div>`;
  const frame = document.createElement("iframe");
  frame.allow = "fullscreen; autoplay; gamepad; clipboard-write; pointer-lock";
  frame.setAttribute("allowfullscreen", "");
  frame.onload = () => { if(frame.srcdoc){ L.style.opacity = 0; setTimeout(() => { if(L.style.opacity === "0") L.hidden = true; }, 320); try{ frame.contentWindow.focus(); }catch{} } };
  stage.prepend(frame);
  try{
    const html = await gameHTML(g);
    if(current !== g) return;
    frame.srcdoc = html;
  }catch(e){
    L.innerHTML = `${iconHTML(g)}<div class="er">Couldn't open ${esc(g.title)}.<br><small>${esc(e.message)}</small></div>`;
  }
}
function stopGame(){ $("#stage iframe")?.remove(); current = null; if(document.fullscreenElement) document.exitFullscreen(); renderDock(); }
async function openNewTab(g = current){
  if(!g) return;
  const t = window.open("about:blank", "_blank");
  try{ const html = await gameHTML(g); t.document.open(); t.document.write(html); t.document.close(); }
  catch{ t?.close(); notify("Couldn't open game", g.title); }
}

const STATUS = { green:"working", yellow:"iffy", red:"down" };
function safeUrl(u){
  u = String(u || "").trim();
  if(!u) return null;
  try{ const x = new URL(/^[a-z][\w+.-]*:/i.test(u) ? u : "https://" + u); return /^https?:$/.test(x.protocol) && x.hostname.includes(".") ? x.href : null; }
  catch{ return null; }
}
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ""); }catch{ return u; } };
function openLinks(){ openWin("links"); renderLinks(); }
function renderLinks(){
  const q = ($("#lnSearch").value || "").toLowerCase();
  const order = { green:0, yellow:1, red:2 };
  const list = siteData.links.filter(l => !q || `${l.label} ${l.url}`.toLowerCase().includes(q)).sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3));
  $("#lkCount").textContent = siteData.links.length || "";
  $("#lnRows").innerHTML = !siteData.links.length ? `<div class="empty"><b>No links yet</b>Check back later.</div>`
    : !list.length ? `<div class="empty"><b>No results</b></div>`
    : list.map(l => { const href = safeUrl(l.url) || "#"; return `<div class="lr">
        <span class="dot ${esc(l.status)}" title="${STATUS[l.status] || ""}"></span>
        <div class="t"><b>${esc(l.label || hostOf(l.url))}</b><small>${esc(l.url)}</small></div>
        <button class="pill" data-copy="${esc(href)}">Copy</button>
        <a class="pill blue" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Open</a></div>`; }).join("");
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch{ const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  notify("Copied", t, appIcon("copy", "#64d2ff", "#0a5fff"), 2200);
}

/* crypto */
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = u8 => { let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pass, saltB64){
  const k = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", salt:fromB64(saltB64), iterations:210000, hash:"SHA-256" }, k, 512));
  return { verifier: toB64(bits.slice(0, 32)), key: await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["encrypt", "decrypt"]) };
}
const TOKEN_KEY = `admintok:${SITE.user}/${SITE.repo}`;
async function sealToken(tok, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, te.encode(tok)));
  store.set(TOKEN_KEY, { iv:toB64(iv), ct:toB64(ct) });
}
async function openToken(key){
  const s = store.get(TOKEN_KEY, null);
  if(!s) return null;
  try{ return td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:fromB64(s.iv) }, key, fromB64(s.ct))); }catch{ return null; }
}
const sameStr = (a, b) => a.length === b.length && [...a].reduce((x, c, i) => x | (c.charCodeAt(0) ^ b.charCodeAt(i)), 0) === 0;

/* GitHub */
const GH = `https://api.github.com/repos/${SITE.user}/${SITE.repo}`;
async function gh(path, opt = {}, token = A.token){
  let r;
  try{ r = await fetch(GH + path, { ...opt, cache:"no-store", headers:{ Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", ...(opt.body ? { "Content-Type":"application/json" } : {}) } }); }
  catch{ throw new Error("Can't reach GitHub. It's probably blocked on this network.\nPublish from somewhere else, or press Download and upload site.json to the repo yourself."); }
  if(r.status === 401) throw new Error("GitHub rejected the token (wrong or expired).");
  if(r.status === 403) throw new Error("This token isn't allowed to change the repo. It needs Contents: Read and write.");
  return r;
}
async function checkToken(tok){
  const r = await gh("", {}, tok);
  if(r.status === 404) throw new Error(`This token can't see ${SITE.user}/${SITE.repo}. Give it access to that repo.`);
  if(!r.ok) throw new Error(`GitHub said ${r.status}`);
  const j = await r.json();
  if(!j.permissions?.push) throw new Error("This token can read the repo but can't write to it. It needs Contents: Read and write.");
}
async function publishData(data, msg = "Update site from admin panel"){
  const path = `/contents/${SITE.file}`;
  const g = await gh(`${path}?ref=${encodeURIComponent(SITE.branch)}`);
  let sha;
  if(g.ok) sha = (await g.json()).sha; else if(g.status !== 404) throw new Error(`GitHub said ${g.status}`);
  const body = { message: msg, branch: SITE.branch, content: toB64(te.encode(JSON.stringify(data, null, 2) + "\n")) };
  if(sha) body.sha = sha;
  const r = await gh(path, { method:"PUT", body: JSON.stringify(body) });
  if(!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(`GitHub said ${r.status}${j.message ? ": " + j.message : ""}`); }
  fetch(`https://purge.jsdelivr.net/gh/${SITE.user}/${SITE.repo}@${SITE.branch}/${SITE.file}`).catch(() => {});
  siteData = clone(data);
  applySite();
}

      <input class="fld" id="oUrl" placeholder="https://example.com" style="flex:2;min-width:180px"><input class="fld" id="oLabel" placeholder="Label (optional)" style="flex:1;min-width:120px">
      ${picker("one")}<button class="btn">Add</button></form></div>
    <div class="gtitle">Add in bulk</div><div class="group"><div class="row" style="flex-direction:column;align-items:stretch;padding:12px 14px">
      <textarea class="fld" id="bText" rows="5" spellcheck="false" placeholder="One link per line. Any of these work:&#10;https://example.com&#10;https://example.com | My label&#10;https://example.com | My label | yellow"></textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span style="color:var(--sub);font-size:12px">Default</span>${picker("bulk")}<span style="flex:1"></span><span id="bInfo" style="color:var(--sub);font-size:12px"></span><button class="btn" type="button" data-act="bulk">Add all</button></div></div></div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 4px 7px"><span class="gtitle" style="margin:0">All links <span id="lCount"></span></span><span style="flex:1"></span>
      <input class="fld" id="lFilter" placeholder="Filter…" value="${esc(A.filter)}" style="width:180px;height:26px"></div>
    <div class="group"><div class="row" style="gap:8px;font-size:12px;color:var(--sub)"><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="lAll" style="accent-color:var(--accent)"> All</label><span id="selN">0 selected</span><span style="flex:1"></span>
      <span>Set</span>${["green","yellow","red"].map(s => `<button type="button" class="pk" data-act="setsel" data-s="${s}" title="Mark selected ${STATUS[s]}"><span class="dot ${s}"></span></button>`).join("")}
      <button type="button" class="btn red" data-act="delsel">Delete</button></div><div id="lList"></div></div>
    <div class="help">Click a dot to change it: green = working, yellow = iffy, red = down. Click a label or link to edit it.</div>`;
}
function iconsPane(){
  const set = Object.keys(A.draft.icons || {});
  return `<div class="help" style="margin:0 4px 14px">Give any game a real logo: paste an image link (PNG, JPG, WebP or SVG). Square images look best. Everyone sees it after you publish.</div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 4px 7px"><span class="gtitle" style="margin:0">Find a game</span><span style="flex:1"></span>
      <input class="fld" id="iSearch" placeholder="Search games…" value="${esc(A.iconQ)}" style="width:220px;height:26px"></div>
    <div class="group" id="iList"></div>
    <div class="gtitle">Logos you've set (${set.length})</div><div class="group" id="iSet"></div>`;
}
function iconRow(g){
  const v = A.draft.icons?.[g.id] || "";
  const saved = siteData.icons; siteData.icons = A.draft.icons; const h = iconHTML(g); siteData.icons = saved;
  return `<div class="irow" data-gid="${esc(g.id)}">${h}<b title="${esc(g.title)}">${esc(g.title)}</b>
    <input class="fld" data-icon placeholder="https://…/logo.png" value="${esc(v)}">${v ? `<button class="xbtn" data-act="unicon" title="Remove logo">×</button>` : `<span style="width:22px"></span>`}</div>`;
}
function refreshIcons(){
  const q = A.iconQ.toLowerCase().replace(/\s+/g, "");
  const found = q ? games.filter(g => g.title.toLowerCase().replace(/\s+/g, "").includes(q)).slice(0, 12) : [];
  $("#iList").innerHTML = !q ? `<div class="irow" style="color:var(--sub)">Type a game name above.</div>` : found.length ? found.map(iconRow).join("") : `<div class="irow" style="color:var(--sub)">No games match.</div>`;
  const set = Object.keys(A.draft.icons || {}).map(gameById).filter(Boolean);
  $("#iSet").innerHTML = set.length ? set.map(iconRow).join("") : `<div class="irow" style="color:var(--sub)">None yet.</div>`;
  updateDirty();
}
function sitePane(){
  const d = A.draft;
  return `<div class="gtitle">Site name</div><div class="group"><div class="row"><input class="fld" data-site="siteName" value="${esc(d.siteName || "")}" placeholder="${esc(DEFAULT_NAME)}" maxlength="24" style="flex:1"></div></div>
    <div class="gtitle">Announcement</div><div class="group"><div class="row" style="padding:12px 14px"><textarea class="fld" data-site="announcement" rows="3" maxlength="400" placeholder="Shows as a notification and a sticky note on everyone's desktop. Leave empty to hide.">${esc(d.announcement || "")}</textarea></div></div>
    <div class="help">Changes go live for everyone when you press Publish. jsDelivr can take a few minutes to show them.</div>`;
}
function securityPane(){
  return `<div class="gtitle">Change passcode</div><div class="group"><form class="row" data-form="chpass" style="flex-wrap:wrap">
      <input class="fld" type="password" id="cOld" placeholder="Current passcode" autocomplete="current-password" style="flex:1;min-width:140px">
      <input class="fld" type="password" id="cNew" placeholder="New passcode" autocomplete="new-password" style="flex:1;min-width:140px">
      <input class="fld" type="password" id="cNew2" placeholder="New passcode again" autocomplete="new-password" style="flex:1;min-width:140px">
      <button class="btn">Change</button></form></div><div class="help" style="margin:-10px 4px 18px">This publishes right away, along with any other unpublished changes.</div>
    <div class="gtitle">GitHub token</div><div class="group"><form class="row" data-form="retoken"><input class="fld" type="password" id="rTok" placeholder="New token (github_pat_…)" autocomplete="off" style="flex:1"><button class="btn">Replace</button></form></div>
    <div class="gtitle">This device</div><div class="group"><div class="row"><div class="lab">Forget token on this device<small>You'll need to paste it again next time.</small></div><button type="button" class="btn red" data-act="forget">Forget</button></div></div>
    <div class="help">The passcode keeps people out of this page, and your token is what actually lets it change the site. Anyone who reads the site's code can find this page, so use a passcode that isn't easy to guess.</div>`;
}
function refreshList(){
  const f = A.filter.toLowerCase(), all = A.draft.links;
  const rows = all.filter(l => !f || `${l.label} ${l.url}`.toLowerCase().includes(f));
  A.sel = new Set([...A.sel].filter(id => all.some(l => l.id === id)));
  $("#lCount").textContent = `(${all.length})`;
  $("#lList").innerHTML = !all.length ? `<div class="row" style="color:var(--sub)">No links yet. Add some above.</div>`
    : !rows.length ? `<div class="row" style="color:var(--sub)">Nothing matches "${esc(A.filter)}"</div>`
    : rows.map(l => `<div class="lrow" data-id="${l.id}"><input type="checkbox" class="lsel" ${A.sel.has(l.id) ? "checked" : ""}>
        <button type="button" class="dot ${l.status}" data-act="cycle" title="${STATUS[l.status]}. Click to change."></button>
        <input class="lin" data-f="label" value="${esc(l.label || "")}" placeholder="${esc(hostOf(l.url))}"><input class="lin u" data-f="url" value="${esc(l.url)}">
        <button type="button" class="xbtn" data-act="del" title="Delete">×</button></div>`).join("");
  updateSel(); updateDirty();
}
function updateSel(){
  if($("#selN")) $("#selN").textContent = `${A.sel.size} selected`;
  const boxes = $$("#lList .lsel");
  if($("#lAll")) $("#lAll").checked = boxes.length > 0 && boxes.every(b => b.checked);
}
function addLinks(items){
  let added = 0, dup = 0, bad = 0;
  const have = new Set(A.draft.links.map(l => l.url));
  for(const it of items){
    const u = safeUrl(it.url);
    if(!u){ bad++; continue; } if(have.has(u)){ dup++; continue; }
    have.add(u);
    A.draft.links.push({ id:uid(), url:u, label:String(it.label || "").trim().slice(0, 80), status: STATUS[it.status] ? it.status : "green", added:Date.now() });
    added++;
  }
  const parts = [`Added ${added}`]; if(dup) parts.push(`${dup} already there`); if(bad) parts.push(`${bad} not valid links`);
  pmsg(parts.join(" · "), added ? "ok" : "e");
  refreshList();
  return added;
}
function parseBulk(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    let parts = line.split(/\s*[|\t]\s*/);
    if(parts.length === 1){ const m = line.match(/^(\S+)\s+(.+)$/); if(m) parts = [m[1], m[2]]; }
    let [url, label = "", st] = parts;
    if(st === undefined && STATUS_WORDS[label.toLowerCase()]){ st = label; label = ""; }
    return { url, label, status: STATUS_WORDS[String(st || "").toLowerCase()] || A.pick.bulk };
  });
}
async function doPublish(data, label){
  A.busy = true; updateDirty();
  const btn = $("#admPublish"); btn.textContent = "Publishing…";
  try{ await publishData(data); pmsg(`${label || "Published"}. Live for everyone in a few minutes (jsDelivr cache).`, "ok"); notify("Published", "site.json updated", appIcon("term", "#3a3a3c", "#0c0c0e")); return true; }
  catch(e){ pmsg(e.message, "e"); msg(e.message, "e"); return false; }
  finally{ A.busy = false; btn.textContent = "Publish"; updateDirty(); }
}
function downloadJSON(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(A.draft, null, 2) + "\n"], { type:"application/json" }));
  a.download = SITE.file; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  pmsg(`Downloaded ${SITE.file}. Upload it to ${SITE.user}/${SITE.repo} on GitHub to make it live.`, "ok");
}
const enterPanel = () => { A.view = "panel"; A.draft = clone(siteData); A.draft.icons ||= {}; renderAdmin(); };
function shakeForm(){ const f = $("#admBody form"); if(!f) return; f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); }
$("#admLock").onclick = lockAdmin;
$("#admDownload").onclick = downloadJSON;
$("#admPublish").onclick = () => isDirty() && doPublish(A.draft);
$("#admSide").addEventListener("click", e => { const t = e.target.closest("[data-atab]"); if(t){ A.tab = t.dataset.atab; renderAdmin(); } });
$("#admBody").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target.dataset.form;
  if(A.busy) return;
  A.busy = true;
  try{
    if(form === "unlock"){
      if(Date.now() < A.until) return msg(`Too many tries. Wait ${Math.ceil((A.until - Date.now()) / 1000)}s.`, "e");
      const pass = $("#aPass").value; if(!pass) return;
      msg("Checking…");
      const d = await derive(pass, siteData.admin.salt);
      if(!sameStr(d.verifier, siteData.admin.verifier)){
        if(++A.fails >= 5){ A.fails = 0; A.until = Date.now() + 30000; }
        $("#aPass").value = ""; shakeForm(); return msg("Wrong passcode.", "e");
      }
      A.fails = 0; A.key = d.key; A.token = await openToken(d.key);
      if(!A.token){ A.view = "token"; return renderAdmin(); }
      enterPanel();
    } else if(form === "setup"){
      const p1 = $("#sP1").value, p2 = $("#sP2").value, tok = $("#sTok").value.trim();
      if(p1.length < 6){ shakeForm(); return msg("Passcode needs at least 6 characters.", "e"); }
      if(p1 !== p2){ shakeForm(); return msg("The two passcodes don't match.", "e"); }
      if(!tok) return msg("Paste your GitHub token.", "e");
      msg("Checking token…"); await checkToken(tok);
      const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
      const d = await derive(p1, salt);
      A.token = tok; msg("Saving to GitHub…");
      await publishData({ ...clone(siteData), admin:{ salt, verifier:d.verifier } }, "Set up admin panel");
      await sealToken(tok, d.key); A.key = d.key;
      enterPanel(); notify("Admin is ready", "Search \"sudo su\" in Spotlight to come back.", appIcon("term", "#3a3a3c", "#0c0c0e"));
    } else if(form === "token"){
      const tok = $("#tTok").value.trim(); if(!tok) return;
      msg("Checking token…"); await checkToken(tok);
      await sealToken(tok, A.key); A.token = tok; enterPanel();
    } else if(form === "addone"){
      if(addLinks([{ url:$("#oUrl").value, label:$("#oLabel").value, status:A.pick.one }])){ $("#oUrl").value = ""; $("#oLabel").value = ""; $("#oUrl").focus(); }
    } else if(form === "chpass"){
      const old = $("#cOld").value, n1 = $("#cNew").value, n2 = $("#cNew2").value;
      if(!sameStr((await derive(old, siteData.admin.salt)).verifier, siteData.admin.verifier)) return pmsg("Current passcode is wrong.", "e");
      if(n1.length < 6) return pmsg("New passcode needs at least 6 characters.", "e");
      if(n1 !== n2) return pmsg("The new passcodes don't match.", "e");
      const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
      const d = await derive(n1, salt), prev = A.draft.admin;
      A.draft.admin = { salt, verifier:d.verifier }; A.busy = false;
      if(await doPublish(A.draft, "Passcode changed")){ await sealToken(A.token, d.key); A.key = d.key; ["#cOld","#cNew","#cNew2"].forEach(i => $(i).value = ""); }
      else A.draft.admin = prev;
    } else if(form === "retoken"){
      const tok = $("#rTok").value.trim(); if(!tok) return;
      pmsg("Checking token…"); await checkToken(tok);
      await sealToken(tok, A.key); A.token = tok; $("#rTok").value = ""; pmsg("Token replaced.", "ok");
    }
  }catch(err){ msg(err.message, "e"); }
  finally{ A.busy = false; updateDirty(); }
});
$("#admBody").addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]");
  if(pk){ A.pick[pk.dataset.pick] = pk.dataset.s; pk.parentElement.querySelectorAll(".pk").forEach(b => b.classList.toggle("on", b === pk)); return; }
  const act = e.target.closest("[data-act]")?.dataset.act; if(!act) return;
  const row = e.target.closest(".lrow"), link = row && A.draft.links.find(l => l.id === row.dataset.id);
  if(act === "cycle" && link){ link.status = NEXT[link.status] || "green"; refreshList(); }
  else if(act === "del" && link){ A.draft.links = A.draft.links.filter(l => l !== link); refreshList(); }
  else if(act === "bulk"){ const items = parseBulk($("#bText").value); if(!items.length) return pmsg("Paste some links first.", "e"); if(addLinks(items)){ $("#bText").value = ""; $("#bInfo").textContent = ""; } }
  else if(act === "setsel"){ if(!A.sel.size) return pmsg("Select some links first.", "e"); const s = e.target.closest("[data-s]").dataset.s; A.draft.links.forEach(l => { if(A.sel.has(l.id)) l.status = s; }); refreshList(); }
  else if(act === "delsel"){ if(!A.sel.size) return pmsg("Select some links first.", "e"); if(!confirm(`Delete ${A.sel.size} link${A.sel.size === 1 ? "" : "s"}?`)) return; A.draft.links = A.draft.links.filter(l => !A.sel.has(l.id)); A.sel.clear(); refreshList(); }
  else if(act === "unicon"){ const id = e.target.closest("[data-gid]").dataset.gid; delete A.draft.icons[id]; refreshIcons(); }
  else if(act === "forget"){ if(!confirm("Remove your GitHub token from this device?")) return; store.del(TOKEN_KEY); A.token = null; lockAdmin(); }
});
$("#admBody").addEventListener("change", e => {
  const el = e.target;
  if(el.classList.contains("lsel")){ const id = el.closest(".lrow").dataset.id; el.checked ? A.sel.add(id) : A.sel.delete(id); return updateSel(); }
  if(el.id === "lAll"){ $$("#lList .lrow").forEach(r => el.checked ? A.sel.add(r.dataset.id) : A.sel.delete(r.dataset.id)); return refreshList(); }
  if(el.classList.contains("lin")){
    const link = A.draft.links.find(l => l.id === el.closest(".lrow").dataset.id); if(!link) return;
    if(el.dataset.f === "url"){ const u = safeUrl(el.value); if(!u){ el.value = link.url; return pmsg("That's not a valid link.", "e"); } link.url = el.value = u; }
    else link.label = el.value.trim().slice(0, 80);
    updateDirty();
  }
  if(el.hasAttribute("data-icon")){
    const id = el.closest("[data-gid]").dataset.gid, v = el.value.trim();
    if(!v){ delete A.draft.icons[id]; return refreshIcons(); }
    const u = safeUrl(v); if(!u) return pmsg("That's not a valid image link.", "e");
    A.draft.icons[id] = u; pmsg(`Logo set for ${gameById(id)?.title || id}. Publish to make it live.`, "ok"); refreshIcons();
  }
});
$("#admBody").addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.site){ A.draft[el.dataset.site] = el.value; updateDirty(); }
  else if(el.id === "lFilter"){ A.filter = el.value; refreshList(); }
  else if(el.id === "iSearch"){ A.iconQ = el.value; refreshIcons(); }
  else if(el.id === "bText"){ const n = parseBulk(el.value).length; $("#bInfo").textContent = n ? `${n} line${n === 1 ? "" : "s"}` : ""; }
});
addEventListener("beforeunload", e => { if(isDirty()){ e.preventDefault(); e.returnValue = ""; } });

/* =====================================================================
   KEYBOARD
   ===================================================================== */
addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if(!$("#login").hidden || $("#boot")) return;
  if(mod && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#spot").hidden ? openSpot() : closeSpot(); return; }
  if(mod && e.key.toLowerCase() === "l"){ e.preventDefault(); lockScreen(); return; }
  if(e.key === "Escape"){ if(!$("#spot").hidden) closeSpot(); else if($("#menu")) closeMenu(); else if(typing) document.activeElement.blur(); return; }
  if(typing || mod || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k === "/"){ e.preventDefault(); openSpot(); }
  else if(k === "r") randomGame();
  else if(k === "f" && current && activeWin() === W("player")) $("#pFull").click();
});

/* =====================================================================
   START
   ===================================================================== */
applyLook();
tick(); setInterval(tick, 15000);
renderDock();
boot();
loadSite();
loadGames()
  .then(list => { games = list; renderGames(); renderWidgets(); renderDock(); })
  .catch(err => { $("#glGrid").innerHTML = `<div class="empty"><b>Couldn't load games</b>${esc(err.message)}</div>`; });
</script>
</body>
</html>
